# This is a Declarative Automation Bundle definition for databricks_free_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_free_demo
  uuid: 32b064c7-f057-4206-982a-e93183629268

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  sp_id :
    description: SS

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-17efe49a-d95b.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
      sp_id: 218f4aed-8de0-428b-8702-c1d6f11f945e
  prod:
    mode: production
    workspace:
      host: https://dbc-e94c9eea-8073.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/hhokyung@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/d1185284-4f87-4c40-9e68-ddb31350c87e/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
      sp_id: d1185284-4f87-4c40-9e68-ddb31350c87e
    permissions:
      - service_principal_name: d1185284-4f87-4c40-9e68-ddb31350c87e
        level: CAN_MANAGE
